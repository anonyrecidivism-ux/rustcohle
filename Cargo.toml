[package]
name = "rustcohle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustcohle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
kamadak-exif = "0.5"
md5 = "0.7"
urlencoding = "2.1"
